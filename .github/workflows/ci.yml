name: TaSTP CI Automated Quality & Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  qa-scan:
    name: Full QA & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Backend Dependencies & QA Tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy bandit pip-audit pytest-cov

      - name: Install Frontend Dependencies & Playwright Browsers
        run: |
          cd frontend
          npm ci || npm install
          npx playwright install --with-deps chromium
          cd ..

      - name: Run Full Automated QA Scanner (scripts/scan.sh)
        run: |
          chmod +x scripts/scan.sh
          bash scripts/scan.sh
